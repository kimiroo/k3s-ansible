---
k3s_cluster:
  children:
    server:
      hosts:
        rocky-master-01:
          ansible_host: 10.10.20.11
          node_ipv6: fdab:d9c3:fb50:10:20::11
        rocky-master-02:
          ansible_host: 10.10.20.21
          node_ipv6: fdab:d9c3:fb50:10:20::21
        rocky-master-03:
          ansible_host: 10.10.20.31
          node_ipv6: fdab:d9c3:fb50:10:20::31
    agent:
      hosts:
        rocky-worker-01:
          ansible_host: 10.10.20.12
          node_ipv6: fdab:d9c3:fb50:10:20::12
        rocky-worker-02:
          ansible_host: 10.10.20.22
          node_ipv6: fdab:d9c3:fb50:10:20::22
        rocky-worker-03:
          ansible_host: 10.10.20.32
          node_ipv6: fdab:d9c3:fb50:10:20::32

  # Required Vars
  vars:
    ansible_port: 22
    ansible_user: yongj
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519_vm
    ansible_python_interpreter: /usr/bin/python3

    k3s_version: v1.36.1+k3s1
    token: "changeme!" # `openssl rand -base64 64` or `pwgen -s 64 1`
    api_endpoint: kube.internal.darak.dev
    api_endpoint_list:
      - 10.10.200.1
      - fdab:d9c3:fb50:10:200::1
    api_external_lb: true
    cluster_cidr: 10.42.0.0/16,fdab:d9c3:fb50:42::/64
    service_cidr: 10.43.0.0/16,fdab:d9c3:fb50:43::/112

    # kube-vip configuration (ARP only)
    install_kube_vip: false
    kube_vip_tag_version: v1.2.0

    # Calico configuration
    install_calico: true
    calico_tag_version: v3.32.0
    calico_bgp: true
    calico_disable_kube_proxy: true
    calico_linux_dataplane: BPF
    calico_ip_pools:
      - name: default-ipv4-ippool
        cidr: 10.42.0.0/16  # k3s Pod CIDR
        blockSize: 26
        encapsulation: None # L2 ARP (No tunneling)
        natOutgoing: Enabled
        nodeSelector: all()
      - name: default-ipv6-ippool
        cidr: fdab:d9c3:fb50:42::/64 # k3s Pod CIDR
        blockSize: 122
        encapsulation: None
        natOutgoing: Enabled
        nodeSelector: all()
    calico_bgp_asn: 64513
    calico_wg_enabled: true
    calico_prometheus_metrics: true

    # Disable the taint manually by setting: k3s_master_taint = false
    k3s_master_taint: "{{ true if groups['agent'] | default([]) | length >= 1 else false }}"

    # Optional vars
    extra_server_args: >-
      --node-ip={{ ansible_host }},{{ node_ipv6 }}
      --cluster-cidr={{ cluster_cidr }}
      --service-cidr={{ service_cidr }}
      {{ '--node-taint node-role.kubernetes.io/control-plane=true:NoSchedule' if k3s_master_taint else '' }}
      --tls-san {{ api_endpoint }}
      {% if api_endpoint_list is defined %}
      {% for ip in api_endpoint_list %}
      --tls-san {{ ip }}
      {% endfor %}
      {% endif %}
      {% if install_calico | default(false) %}
      {% if calico_disable_kube_proxy | default(false) %}
      --disable-kube-proxy
      {% endif %}
      --flannel-backend=none
      --disable-network-policy
      --kube-controller-manager-arg=allocate-node-cidrs=false
      {% endif %}
      --disable servicelb
      --disable traefik
    extra_agent_args: >-
      --node-ip={{ ansible_host }},{{ node_ipv6 }}

    server_config_yaml:  |
      # https://docs.k3s.io/installation/configuration#configuration-file

      # Common
      #etcd-s3: true
      #etcd-s3-endpoint: "<CLOUDFLARE_ACCOUNT_ID>.r2.cloudflarestorage.com"
      #etcd-s3-bucket: "<BUCKET_NAME>"
      #etcd-s3-folder: "etcd-snapshots"
      #etcd-s3-access-key: "<R2_ACCESS_KEY_ID>"
      #etcd-s3-secret-key: "<R2_SECRET_ACCESS_KEY>"
      #etcd-s3-region: "auto"
      #etcd-snapshot-compress: true
      #secrets-encryption: true

      # Only on first master node
      {% if inventory_hostname == groups['server'][0] %}
      #etcd-snapshot-schedule-cron: "0 */12 * * *"
      #etcd-snapshot-retention: 14
      {% endif %}
    # agent_config_yaml:  |
    #   https://docs.k3s.io/installation/configuration#configuration-file
    # registries_config_yaml:  |
    #   https://docs.k3s.io/installation/private-registry